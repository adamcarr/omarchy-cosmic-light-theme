# Cosmic Light Theme - Based on Catppuccin Latte structure with Cosmic colors

[colors.primary]
background = "#d4d4d4"      # Medium grey background for better contrast
foreground = "#4c4f69"      # Use Catppuccin's exact foreground
dim_foreground = "#8c8fa1"
bright_foreground = "#4c4f69"

[colors.cursor]
text = "#d4d4d4"
cursor = "#00525A"          # COSMIC Blue Dark (official)

[colors.vi_mode_cursor]
text = "#d4d4d4"
cursor = "#624000"          # COSMIC Orange Dark (official)

[colors.search.matches]
foreground = "#d4d4d4"
background = "#6c6f85"

[colors.search.focused_match]
foreground = "#d4d4d4"
background = "#00525A"      # COSMIC Blue Dark

[colors.footer_bar]
foreground = "#d4d4d4"
background = "#6c6f85"

[colors.hints.start]
foreground = "#d4d4d4"
background = "#624000"      # COSMIC Orange Dark

[colors.hints.end]
foreground = "#d4d4d4"
background = "#6c6f85"

[colors.selection]
text = "#d4d4d4"
background = "#00525A"      # COSMIC Blue Dark

[colors.normal]
black = "#bcc0cc"           # Keep Catppuccin's exact black
red = "#78292E"             # COSMIC Red Dark (official)
green = "#185529"           # COSMIC Green Dark (official)
yellow = "#534800"          # COSMIC Yellow Dark (official)
blue = "#00525A"            # COSMIC Blue Dark (official)
magenta = "#68217C"         # COSMIC Purple Dark (official)
cyan = "#00525A"            # COSMIC Blue Dark (cyan uses blue)
white = "#5c5f77"           # Keep Catppuccin's exact white

[colors.bright]
black = "#acb0be"           # Keep Catppuccin's exact bright black
red = "#86043A"             # COSMIC Pink Dark (bright red)
green = "#185529"           # COSMIC Green Dark (official)
yellow = "#624000"          # COSMIC Orange Dark (bright yellow)
blue = "#2E496D"            # COSMIC Indigo Dark (bright blue)
magenta = "#68217C"         # COSMIC Purple Dark (official)
cyan = "#00525A"            # COSMIC Blue Dark (bright cyan)
white = "#6c6f85"           # Keep Catppuccin's exact bright white

[colors.dim]
black = "#bcc0cc"
red = "#ef5350"
green = "#66bb6a"
yellow = "#ffa726"
blue = "#42a5f5"
magenta = "#ab47bc"
cyan = "#26a69a"
white = "#6c6f85"

[[colors.indexed_colors]]
index = 16
color = "#624000"           # COSMIC Orange Dark

[[colors.indexed_colors]]
index = 17
color = "#554742"           # COSMIC Warm Grey Dark

[[colors.indexed_colors]]
index = 18
color = "#2E496D"           # COSMIC Indigo Dark
