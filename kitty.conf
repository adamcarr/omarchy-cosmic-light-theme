# Cosmic Light Theme for Kitty Terminal

# Font configuration
font_family      Noto Sans Mono
bold_font        Noto Sans Mono Bold
italic_font      Noto Sans Mono Italic
bold_italic_font Noto Sans Mono Bold Italic
font_size        12.0

# Colors
foreground              #4c4f69
background              #d4d4d4
selection_foreground    #d4d4d4
selection_background    #00525A

# Cursor colors
cursor                  #00525A
cursor_text_color       #d4d4d4

# URL underline color when hovering with mouse
url_color               #00525A

# Tab bar
active_tab_foreground   #d4d4d4
active_tab_background   #00525A
inactive_tab_foreground #8c8fa1
inactive_tab_background #b8b8b8

# The 16 terminal colors (COSMIC official palette)

# black
color0   #bcc0cc
color8   #acb0be

# red
color1   #78292E
color9   #86043A

# green
color2   #185529
color10  #185529

# yellow
color3   #534800
color11  #624000

# blue
color4   #00525A
color12  #2E496D

# magenta
color5   #68217C
color13  #68217C

# cyan
color6   #00525A
color14  #00525A

